{

<style>
  :root {
    --bg: #0b0b0d; --panel: #141418; --text: #f2f0ea; --muted: #a9a59b;
    --accent: #f4c430; --line: rgba(255,255,255,.12);
    --rainbow: linear-gradient(90deg,#e8352e,#f39c12,#f4d03f,#3cb44b,#2f80ed,#8e44ad);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Oswald', system-ui, sans-serif; overflow: hidden; }
  .rock { font-family: 'New Rocker', 'Oswald', serif; font-weight: 400; letter-spacing: .02em; }
  header { position: fixed; inset: 0 0 auto 0; z-index: 20; background: rgba(11,11,13,.86);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  header::after { content: ""; display: block; height: 3px; background: var(--rainbow); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: 0 0 auto; border: 1px solid var(--line); background: transparent; color: var(--text);
    padding: 9px 14px; border-radius: 999px; font: 500 14px/1 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); }
  main { position: fixed; inset: 0; }
  .visor { position: absolute; inset: 0; }
  .visor[hidden] { display: block; visibility: hidden; pointer-events: none; }

  /* Parada (video congelado) */
  #parada { position: fixed; left: 50%; bottom: max(70px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 15; width: min(440px, calc(100% - 32px)); background: rgba(20,20,24,.94); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #parada[hidden] { display: none; }
  #parada h2 { margin: 0 0 4px; font: 400 26px/1.05 'New Rocker', serif; color: #fff; text-shadow: 0 0 10px rgba(244,196,48,.35); }
  #parada p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 14px; font: 600 15px/1 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
  .btn.primario { background: var(--accent); color: #111; }
  .btn.sec { background: transparent; color: var(--text); border: 1px solid var(--line); }

  /* Marcador dentro de la escena */
  .chip-escena { background: rgba(244,196,48,.95); color: #111; font: 600 15px/1 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: .05em;
    padding: 10px 14px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.5); white-space: nowrap; cursor: pointer;
    animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.06); } }

  /* Panel deslizable (carta / cartelera) */
  #panel { position: fixed; z-index: 30; inset: auto 0 0 0; max-height: 78vh; overflow: auto; background: var(--panel);
    border-top: 3px solid transparent; border-image: var(--rainbow) 1; border-radius: 0;
    transform: translateY(100%); transition: transform .3s ease; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  #panel.abierto { transform: none; }
  @media (min-width: 760px) { #panel { left: auto; top: 0; bottom: 0; width: 420px; max-height: none; transform: translateX(100%);
    border-top: 0; border-left: 3px solid; } }
  #panel .cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  #panel h2 { margin: 0; font: 400 32px/1 'New Rocker', serif; }
  #panel h3 { font-family: 'Oswald', sans-serif !important; }
  #panel h3 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .fila { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .fila .em { font-size: 22px; width: 30px; text-align: center; }
  .fila .t { flex: 1; } .fila b { display: block; font: 400 19px/1.15 'New Rocker', serif; letter-spacing: .02em; } .fila small { color: var(--muted); }
  .fila .p { font-weight: 700; white-space: nowrap; }
  .cerrar { background: transparent; border: 1px solid var(--line); color: var(--text); width: 38px; height: 38px;
    border-radius: 50%; font-size: 18px; cursor: pointer; }

  /* Ayuda del muro */
  #ayudaMuro { position: fixed; z-index: 15; left: 50%; bottom: max(70px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(20,20,24,.9); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 14px;
    display: flex; gap: 10px; align-items: center; white-space: nowrap; }
  #ayudaMuro[hidden] { display: none; }
  #ayudaMuro button { padding: 7px 12px; font-size: 13px; }

  /* Ladrillos */
  .psv-marker--poly.ladrillo { cursor: pointer; transition: fill .15s; }
  .psv-marker--poly.ladrillo:hover { fill: rgba(244,196,48,.35) !important; }

  /* Nombres de músicos sobre los murales */
  .musico { pointer-events: none; white-space: nowrap; line-height: 1; text-align: center;
    animation: aparecer .9s cubic-bezier(.2,1.4,.4,1) both, vibrar 2.6s ease-in-out .9s infinite; }
  @keyframes aparecer { from { opacity: 0; transform: scale(.4) rotate(-6deg); filter: blur(8px); } }
  @keyframes vibrar { 50% { transform: scale(1.05) rotate(-1deg); } }
  .musico.hendrix { font: 64px/1 'Shrikhand', cursive; transform: rotate(-4deg); padding: 0 .1em;
    background: linear-gradient(90deg,#ff2d95,#ff9f1c,#ffe14d,#3cf06e,#29b6ff,#b44dff,#ff2d95); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 6px rgba(255,80,200,.9)) drop-shadow(0 0 18px rgba(120,60,255,.7));
    animation: aparecer .9s cubic-bezier(.2,1.4,.4,1) both, arcoiris 3s linear infinite, vibrar 2.6s ease-in-out .9s infinite; }
  @keyframes arcoiris { to { background-position: 200% 0; } }
  .musico.cobain { font: 900 70px/1 'Bodoni Moda', serif; letter-spacing: .02em; color: #fff;
    text-shadow: 0 0 4px #fff, 0 0 14px #fffbe0, 0 0 30px #f4c430, 0 0 50px #f4c430;
    animation: aparecer .9s cubic-bezier(.2,1.4,.4,1) both, parpadeo 4s steps(1) 1s infinite; }
  .musico.cobain span { display: inline-block; transform: scaleX(.62); }
  @keyframes parpadeo { 0%,100% { opacity: 1; } 42% { opacity: .55; } 44% { opacity: 1; } 71% { opacity: .7; } 72% { opacity: 1; } }
  .musico.metal { font: 64px/1 'Metal Mania', cursive; color: #e9e9e9; text-shadow: 0 0 8px #ff2a2a, 0 0 22px #ff2a2a, 3px 3px 0 #300; }
  .musico.neon { font: 54px/1 'Monoton', cursive; color: #7df9ff; text-shadow: 0 0 6px #7df9ff, 0 0 20px #00c3ff, 0 0 40px #0066ff; }
  .musico.punk { font: 52px/1 'Special Elite', monospace; color: #111; background: #ff3ea5; padding: 4px 12px; box-shadow: 4px 4px 0 #111; }
  .musico.blues { font: 46px/1.1 'Rock Salt', cursive; color: #ffd27a; text-shadow: 0 0 8px #ff8c00, 0 0 24px #ff5500; }
  @media (max-width: 760px) { .musico { font-size: 40px !important; } }

  /* Producto recortado sobre el prisma (plano, de frente, sin fondo) */
  #tarjetaPrisma { position: absolute; z-index: 5; pointer-events: none; display: none;
    flex-direction: column; align-items: center; justify-content: flex-end; gap: .25em;
    opacity: 0; transform: translateY(6%) scale(.9); transition: opacity .4s ease, transform .4s cubic-bezier(.2,1.3,.4,1); }
  #tarjetaPrisma.visible { opacity: 1; transform: none; }
  #tarjetaPrisma .producto { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #tarjetaPrisma .producto img { max-width: 100%; max-height: 100%; object-fit: contain;
    filter: drop-shadow(0 .5em .6em rgba(0,0,0,.75)) drop-shadow(0 0 1.2em rgba(255,255,255,.18)); }
  #tarjetaPrisma .emoji { font-size: 5em; line-height: 1; filter: drop-shadow(0 .2em .4em rgba(0,0,0,.7)); }
  #tarjetaPrisma .etiqueta { text-align: center; line-height: 1.1; white-space: nowrap; max-width: 100%;
    padding: .25em .7em; border-radius: .5em; background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
    box-shadow: inset 0 -.18em 0 0 #8e44ad, inset 0 -.36em 0 0 #2f80ed; }
  #tarjetaPrisma .etiqueta b { display: block; color: #f2f0ea; font: 400 1.15em/1.1 'New Rocker', serif; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; }
  #tarjetaPrisma .etiqueta span { color: #f4c430; font: 600 .85em/1.2 'Oswald', sans-serif; letter-spacing: .05em; }
  .psv-tooltip-content { font-family: 'Oswald', sans-serif; letter-spacing: .03em; }
  #ayudaMuro { font-family: 'Oswald', sans-serif; }
  /* Botón que siempre permite volver al recorrido */
  #seguirFlotante { position: fixed; z-index: 16; top: 64px; right: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  #seguirFlotante[hidden] { display: none; }

  /* Modo editar */
  #editor { position: fixed; z-index: 40; top: 64px; right: 10px; background: #000c; color: #7CFC00; font: 12px/1.4 ui-monospace, monospace;
    padding: 8px 10px; border-radius: 8px; max-width: 320px; white-space: pre-wrap; }
  #editor[hidden] { display: none; }
  .psv-navbar { bottom: env(safe-area-inset-bottom); }
  body.en-parada .psv-video-bigbutton { display: none; }
</style>

<body>
<header><nav class="tabs" id="tabs" role="tablist" aria-label="Lugares del bar"></nav></header>
<main>
  <div class="visor" id="visorVideo"></div>
  <div class="visor" id="visorFoto" hidden></div>
</main>

<section id="parada" hidden aria-live="polite">
  <h2 id="paradaTitulo"></h2>
  <p id="paradaTexto"></p>
  <div class="acciones" id="paradaAcciones"></div>
</section>

<button class="btn primario" id="seguirFlotante" hidden>▶ Seguir recorrido</button>

<div id="ayudaMuro" hidden>
  <span id="ayudaTexto">Toca un ladrillo 🧱</span>
  <button class="btn sec" id="volverPrisma" hidden>Ver el prisma</button>
</div>

<aside id="panel" aria-hidden="true">
  <div class="cab"><h2 id="panelTitulo"></h2><button class="cerrar" id="cerrarPanel" aria-label="Cerrar">✕</button></div>
  <div id="panelCuerpo"></div>
</aside>

<div id="editor" hidden></div>

<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { VideoPlugin } from '@photo-sphere-viewer/video-plugin';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
import { EquirectangularVideoAdapter } from '@photo-sphere-viewer/equirectangular-video-adapter';
import { VIDEO, PARADAS as TODAS_PARADAS, PESTANAS, MURO, CARTA, CARTELERA, MUSICOS, VISTA_VIDEO } from './datos.js';
// las paradas 'soloConMusicos' se activan solo si tienen algún nombre escrito
const PARADAS = TODAS_PARADAS.filter((p) => !p.soloConMusicos || MUSICOS.some((m) => m.parada === p.id && m.nombre.trim()));

const $ = (id) => document.getElementById(id);
const rad = (g) => g * Math.PI / 180;
const grados = (r) => Math.round(r * 180 / Math.PI * 10) / 10;
const EDITAR = new URLSearchParams(location.search).has('editar');
const CELULAR = matchMedia('(pointer: coarse), (max-width: 760px)').matches;
const peso = (n) => '$' + n.toLocaleString('es-CL');

// ---------------- Pestañas ----------------
let pestanaActual = null;
for (const p of PESTANAS) {
  const b = document.createElement('button');
  b.textContent = p.label; b.role = 'tab'; b.dataset.id = p.id;
  b.addEventListener('click', () => irA(p.id));
  $('tabs').append(b);
}
function marcarPestana(id) {
  pestanaActual = id;
  for (const b of $('tabs').children) b.setAttribute('aria-selected', b.dataset.id === id);
}

// ---------------- Visor de video (recorrido) ----------------
const visorVideo = new Viewer({
  container: $('visorVideo'),
  adapter: [EquirectangularVideoAdapter, { muted: true, autoplay: false }],
  panorama: { source: CELULAR ? VIDEO.liviano : VIDEO.normal },
  defaultYaw: 0, defaultZoomLvl: 0,
  navbar: ['videoPlay', 'videoVolume', 'videoTime', 'fullscreen'],
  plugins: [[VideoPlugin, { progressbar: true, bigbutton: true }], MarkersPlugin],
  touchmoveTwoFingers: false, mousewheelCtrlKey: false,
  maxFov: VISTA_VIDEO.maxFov,
});
const video = visorVideo.getPlugin(VideoPlugin);
const marcasVideo = visorVideo.getPlugin(MarkersPlugin);

// No dejar que la cámara mire hacia el muñequito (ver VISTA_VIDEO en datos.js)
const grad = (r) => r * 180 / Math.PI;
let corrigiendo = false;
function limitarVista() {
  if (corrigiendo) return;
  const pos = visorVideo.getPosition();
  const h = visorVideo.state.hFov || 90, v = visorVideo.state.vFov || 60;
  const L = VISTA_VIDEO;
  // ángulo llevado al rango [yawMin, yawMin + 360)
  let y = ((grad(pos.yaw) - L.yawMin) % 360 + 360) % 360 + L.yawMin;
  const yMin = L.yawMin + h / 2, yMax = L.yawMax - h / 2;
  let yc = y;
  if (yMin > yMax) yc = (L.yawMin + L.yawMax) / 2;
  else if (y > yMax) yc = (y - yMax < yMin + 360 - y) ? yMax : yMin; // al borde más cercano
  else if (y < yMin) yc = yMin;
  let pc = Math.max(grad(pos.pitch), L.pitchMin + v / 2);
  pc = Math.min(pc, 80);
  if (Math.abs(yc - y) > 0.05 || Math.abs(pc - grad(pos.pitch)) > 0.05) {
    corrigiendo = true;
    visorVideo.rotate({ yaw: rad(yc), pitch: rad(pc) });
    corrigiendo = false;
  }
}
visorVideo.addEventListener('position-updated', limitarVista);
visorVideo.addEventListener('zoom-updated', limitarVista);
visorVideo.addEventListener('ready', () => {
  const ini = PARADAS[0];
  visorVideo.rotate({ yaw: rad(ini ? ini.yaw : -90), pitch: 0 });
}, { once: true });

let paradaActiva = null;
const yaPasadas = new Set();
let tiempoAnterior = 0;

video.addEventListener('progress', () => {
  const t = video.getTime();
  if (t + 0.5 < tiempoAnterior) { // retrocedió: se pueden volver a disparar las paradas
    for (const p of PARADAS) if (p.time > t) yaPasadas.delete(p.id);
  }
  tiempoAnterior = t;
  if (!video.isPlaying() || paradaActiva) return;
  for (const p of PARADAS) {
    if (!yaPasadas.has(p.id) && t >= p.time && t < p.time + 1.5) { congelar(p); break; }
  }
});
video.addEventListener('play-pause', ({ playing }) => {
  if (playing && paradaActiva) cerrarParada();
});

function congelar(p) {
  paradaActiva = p; yaPasadas.add(p.id);
  video.pause();
  visorVideo.animate({ yaw: rad(p.yaw), pitch: rad(p.pitch), zoom: 30, speed: '8rpm' });
  marcasVideo.setMarkers(p.opciones.map((o, i) => ({
    id: `op-${p.id}-${i}`,
    position: { yaw: rad(p.yaw), pitch: rad(p.pitch + 10 - i * 8) },
    html: `<div class="chip-escena">${o.label}</div>`,
    anchor: 'center center',
    data: o,
  })));
  for (const [i, m] of MUSICOS.entries()) {
    if (m.parada !== p.id || !m.nombre.trim()) continue;
    const txt = m.estilo === 'cobain' ? `<span>${m.nombre}</span>` : m.nombre;
    marcasVideo.addMarker({
      id: `musico-${i}`, position: { yaw: rad(m.yaw), pitch: rad(m.pitch) }, anchor: 'center center',
      html: `<div class="musico ${m.estilo}">${txt}</div>`,
    });
  }
  $('paradaTitulo').textContent = p.titulo;
  $('paradaTexto').textContent = p.texto;
  const cont = $('paradaAcciones'); cont.innerHTML = '';
  for (const o of p.opciones) {
    const b = document.createElement('button'); b.className = 'btn primario'; b.textContent = o.label;
    b.onclick = () => ejecutar(o.accion); cont.append(b);
  }
  const seguir = document.createElement('button'); seguir.className = 'btn sec'; seguir.textContent = 'Seguir recorrido ▶';
  seguir.onclick = seguirRecorrido; cont.append(seguir);
  $('parada').hidden = false;
  document.body.classList.add('en-parada');
  marcarPestana(PESTANAS.find((x) => x.parada === p.id)?.id ?? 'recorrido');
}
function cerrarParada() {
  paradaActiva = null; marcasVideo.clearMarkers(); $('parada').hidden = true;
  document.body.classList.remove('en-parada');
}
function seguirRecorrido() {
  cerrarPanel(); cerrarParada(); marcarPestana('recorrido');
  if (finAlcanzado()) { reiniciar(); return; }
  video.play();
}

// Dónde quedó el video cuando se salió a una foto (muro, salón...), para retomarlo
let reanudarEn = null;
const elVideo = () => visorVideo.state.textureData?.texture?.image;
const finAlcanzado = () => { const el = elVideo(); return el && el.duration && el.currentTime >= el.duration - 0.3; };
function reiniciar() {
  yaPasadas.clear(); reanudarEn = null; tiempoAnterior = 0;
  saltarA(0); video.play();
}
function volverAlRecorrido() {
  cerrarPanel();
  $('visorVideo').hidden = false; $('visorFoto').hidden = true; $('ayudaMuro').hidden = true;
  $('seguirFlotante').hidden = true;
  marcarPestana('recorrido');
  const t = reanudarEn ?? 0;
  if (t > 0) {
    for (const p of PARADAS) if (p.time <= t + 0.2) yaPasadas.add(p.id); // no repetir la misma parada
    tiempoAnterior = t;
    saltarA(Math.min(t + 0.3, (elVideo()?.duration || t + 1) - 0.5));
    video.play();
  } else {
    reiniciar();
  }
}
$('seguirFlotante').onclick = volverAlRecorrido;

// Al terminar el video: nunca quedarse sin salida
function mostrarFin() {
  if (paradaActiva) return;
  paradaActiva = { id: 'fin' };
  marcasVideo.clearMarkers();
  $('paradaTitulo').textContent = 'Fin del recorrido';
  $('paradaTexto').textContent = '¿Otra vuelta o pasas al muro a elegir?';
  const cont = $('paradaAcciones'); cont.innerHTML = '';
  const b1 = document.createElement('button'); b1.className = 'btn primario'; b1.textContent = 'Ir al muro de la carta';
  b1.onclick = () => irA('muro');
  const b2 = document.createElement('button'); b2.className = 'btn sec'; b2.textContent = '↺ Ver de nuevo';
  b2.onclick = () => { cerrarParada(); reiniciar(); };
  cont.append(b1, b2);
  $('parada').hidden = false;
  document.body.classList.add('en-parada');
}
visorVideo.addEventListener('ready', () => {
  const el = elVideo();
  if (!el) return;
  el.loop = false;                  // que no vuelva a empezar solo
  el.addEventListener('ended', mostrarFin);
}, { once: true });
marcasVideo.addEventListener('select-marker', ({ marker }) => ejecutar(marker.data.accion));

function ejecutar(accion) {
  const [tipo, valor] = accion.split(':');
  if (tipo === 'panel') abrirPanel(valor);
  if (tipo === 'tab') irA(valor);
}

// ---------------- Visor de fotos (muro, salón...) ----------------
let visorFoto = null, marcasFoto = null, fotoActual = null;
function crearVisorFoto() {
  visorFoto = new Viewer({
    container: $('visorFoto'),
    navbar: ['zoom', 'fullscreen'],
    plugins: [MarkersPlugin],
    maxFov: 120,
    touchmoveTwoFingers: false, mousewheelCtrlKey: false,
  });
  marcasFoto = visorFoto.getPlugin(MarkersPlugin);
  marcasFoto.addEventListener('select-marker', ({ marker }) => {
    if (marker.data?.plato) elegirPlato(marker);
  });
  visorFoto.addEventListener('click', ({ data }) => editorClick(visorFoto, data));
}

async function mostrarFoto(p) {
  if (CELULAR && p.yawCelular !== undefined) p = { ...p, yaw: p.yawCelular, pitch: p.pitchCelular ?? p.pitch };
  if (!visorFoto) crearVisorFoto();
  $('visorFoto').hidden = false; $('visorVideo').hidden = true;
  $('ayudaMuro').hidden = p.id !== 'muro';
  if (p.id !== 'muro') $('volverPrisma').onclick(); // la tarjeta del plato es solo del muro
  if (fotoActual !== p.foto) {
    marcasFoto.clearMarkers();
    await visorFoto.setPanorama(p.foto, { position: { yaw: rad(p.yaw), pitch: rad(p.pitch) }, zoom: p.zoom, transition: false });
    fotoActual = p.foto;
    if (p.id === 'muro') armarMuro();
  } else {
    visorFoto.animate({ yaw: rad(p.yaw), pitch: rad(p.pitch), zoom: p.zoom, speed: '4rpm' });
  }
}

// Salta a un segundo y refresca la imagen aunque el video esté en pausa
function saltarA(t) {
  const el = visorVideo.state.textureData?.texture?.image;
  if (el && el.readyState < 1) { // aún sin cargar: saltar cuando cargue
    el.addEventListener('loadedmetadata', () => saltarA(t), { once: true });
    el.preload = 'auto';
    el.load();
    return;
  }
  if (el) el.addEventListener('seeked', () => {
    const tex = visorVideo.state.textureData?.texture;
    if (tex) tex.needsUpdate = true;
    visorVideo.needsUpdate();
  }, { once: true });
  video.setTime(t);
}

function irA(id) {
  const p = PESTANAS.find((x) => x.id === id);
  if (!p) return;
  cerrarPanel();
  marcarPestana(id);
  if (p.tipo === 'foto') {
    if (!$('visorVideo').hidden) reanudarEn = video.getTime();
    if (video.isPlaying()) video.pause();
    $('seguirFlotante').hidden = false;
    cerrarParada();
    mostrarFoto(p);
    return;
  }
  $('visorVideo').hidden = false; $('visorFoto').hidden = true; $('ayudaMuro').hidden = true;
  $('seguirFlotante').hidden = true;
  cerrarParada();
  const parada = PARADAS.find((x) => x.id === p.parada);
  if (parada) {
    saltarA(parada.time);
    tiempoAnterior = parada.time;
    congelar(parada);
  } else {
    yaPasadas.clear();
    video.setTime(p.time || 0); tiempoAnterior = p.time || 0;
    visorVideo.animate({ yaw: rad(PARADAS[0]?.yaw ?? -90), pitch: 0, zoom: 0, speed: '4rpm' });
    video.play();
  }
}

// ---------------- El muro: ladrillos y prisma ----------------
let tamFoto = { w: 3840, h: 1920 };
const aEsfera = ([x, y]) => [((x / tamFoto.w) - 0.5) * 2 * Math.PI, (0.5 - y / tamFoto.h) * Math.PI];
const ESTILO_LADRILLO = { fill: 'rgba(255,255,255,0.02)', stroke: 'rgba(244,196,48,0.65)', strokeWidth: '2px' };
const ESTILO_ELEGIDO = { fill: 'rgba(244,196,48,0.35)', stroke: '#f4c430', strokeWidth: '3px' };

async function armarMuro() {
  const pd = visorFoto.state.textureData?.panoData;
  if (pd?.fullWidth) tamFoto = { w: pd.fullWidth, h: pd.fullHeight };
  // Ladrillos reales, detectados desde la foto (herramientas/detectar_ladrillos.py)
  let ladrillos = [];
  try {
    const datos = await (await fetch(MURO.ladrillos, { cache: 'no-store' })).json();
    const k = tamFoto.w / (datos.ancho || tamFoto.w); // por si la foto cambió de tamaño
    ladrillos = datos.ladrillos.map((l) => l.puntos.map(([x, y]) => [x * k, y * k]));
    if (datos.hueco) hueco = datos.hueco.map((v) => v * k);
  } catch (e) {
    console.warn('No pude leer ' + MURO.ladrillos + '. Corre: python herramientas/detectar_ladrillos.py', e);
  }
  // Cada ladrillo es un plato; si hay más ladrillos que platos, la carta se repite
  const marcas = [];
  for (let i = 0; i < ladrillos.length && CARTA.length; i++) {
    const plato = CARTA[i % CARTA.length];
    marcas.push({
      id: `ladrillo-${i}`,
      polygon: ladrillos[i].map(aEsfera),
      className: 'ladrillo',
      svgStyle: ESTILO_LADRILLO,
      tooltip: CELULAR ? undefined : { content: `${plato.emoji} ${plato.nombre} · ${peso(plato.precio)}`, position: 'top center' },
      data: { plato },
    });
  }
  marcasFoto.setMarkers(marcas);
  if (CARTA.length > ladrillos.length) console.warn(`Hay ${CARTA.length} platos y solo ${ladrillos.length} ladrillos: algunos platos no quedan en el muro`);
}

let seleccionado = null;
// Hueco negro del prisma donde va el producto [x0, y0, x1, y1] en píxeles de la foto.
// Lo calcula herramientas/detectar_ladrillos.py (ladrillos.json → "hueco").
let hueco = null;
const huecoActual = () => hueco || (() => {
  const xs = MURO.prisma.map((q) => q[0]), ys = MURO.prisma.map((q) => q[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
})();

// El producto es una capa plana sobre el visor (siempre de frente), recortado
// sin fondo y encajado dentro del hueco: no tapa ladrillos y elegir un ladrillo
// NO mueve la cámara. Se mueve y cambia de tamaño junto con la foto.
const capa = document.createElement('div');
capa.id = 'tarjetaPrisma';
capa.innerHTML = '<div class="producto"></div><div class="etiqueta"><b></b><span></span></div>';
function ubicarTarjeta() {
  if (!visorFoto || !capa.classList.contains('visible')) return;
  const [x0, y0, x1, y1] = huecoActual();
  const esq = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(aEsfera);
  const pos = visorFoto.getPosition();
  const cy = (esq[0][0] + esq[1][0]) / 2, cp = (esq[0][1] + esq[2][1]) / 2;
  // si el hueco quedó detrás de la cámara, no se muestra
  const cosAng = Math.sin(pos.pitch) * Math.sin(cp) + Math.cos(pos.pitch) * Math.cos(cp) * Math.cos(cy - pos.yaw);
  if (cosAng < 0.2) { capa.style.display = 'none'; return; }
  const q = esq.map(([yaw, pitch]) => visorFoto.dataHelper.sphericalCoordsToViewerCoords({ yaw, pitch }));
  // rectángulo de pantalla que queda DENTRO de las 4 esquinas (no se sale del hueco)
  const izq = Math.max(q[0].x, q[3].x), der = Math.min(q[1].x, q[2].x);
  const arr = Math.max(q[0].y, q[1].y), aba = Math.min(q[2].y, q[3].y);
  const f = MURO.tamanoTarjeta || 1;
  const w = (der - izq) * f, h = (aba - arr) * f;
  if (w < 20 || h < 20) { capa.style.display = 'none'; return; }
  Object.assign(capa.style, {
    display: 'flex', width: w + 'px', height: h + 'px',
    left: (izq + der - w) / 2 + 'px', top: (arr + aba - h) / 2 + 'px',
    fontSize: Math.max(11, Math.min(w / 11, h / 9)) + 'px',
  });
}
// foto recortada: media/carta/recortes/<nombre>.png (herramientas/recortar_fotos.py)
const rutaRecorte = (plato) => plato.recorte || (plato.foto ? plato.foto.replace(/\/carta\/([^/]+)\.\w+$/, '/carta/recortes/$1.png') : null);
function cargarImagen(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
}
async function elegirPlato(marker) {
  const plato = marker.data.plato;
  if (seleccionado) marcasFoto.updateMarker({ id: seleccionado, svgStyle: ESTILO_LADRILLO });
  seleccionado = marker.id;
  marcasFoto.updateMarker({ id: marker.id, svgStyle: ESTILO_ELEGIDO });
  if (!capa.parentNode) {
    visorFoto.container.appendChild(capa);
    visorFoto.addEventListener('render', ubicarTarjeta);
  }
  let img = null;
  for (const src of [rutaRecorte(plato), plato.foto]) {
    if (!src) continue;
    try { img = await cargarImagen(src); break; } catch { /* probar la siguiente */ }
  }
  if (capa.classList.contains('visible')) { // cambiar de plato: apagar y prender
    capa.classList.remove('visible');
    await new Promise((r) => setTimeout(r, 220));
  }
  const prod = capa.querySelector('.producto');
  prod.innerHTML = '';
  if (img) { img.alt = plato.nombre; prod.append(img); }
  else prod.innerHTML = `<span class="emoji">${plato.emoji}</span>`;
  capa.querySelector('.etiqueta b').textContent = plato.nombre;
  capa.querySelector('.etiqueta span').textContent = peso(plato.precio);
  capa.classList.add('visible');
  ubicarTarjeta();
  $('ayudaTexto').textContent = `${plato.emoji} ${plato.nombre} · ${peso(plato.precio)}`;
  $('volverPrisma').hidden = false;
}
$('volverPrisma').onclick = () => {
  capa.classList.remove('visible');
  if (seleccionado) marcasFoto.updateMarker({ id: seleccionado, svgStyle: ESTILO_LADRILLO });
  seleccionado = null;
  $('ayudaTexto').textContent = 'Toca un ladrillo 🧱'; $('volverPrisma').hidden = true;
};

// ---------------- Paneles (carta / cartelera) ----------------
function abrirPanel(cual) {
  const cuerpo = $('panelCuerpo'); cuerpo.innerHTML = '';
  if (cual === 'carta') {
    $('panelTitulo').textContent = 'La carta';
    const grupos = {};
    for (const p of CARTA) (grupos[p.tipo] ??= []).push(p);
    for (const [tipo, items] of Object.entries(grupos)) {
      cuerpo.insertAdjacentHTML('beforeend', `<h3>${tipo}</h3>`);
      for (const p of items) cuerpo.insertAdjacentHTML('beforeend',
        `<div class="fila"><span class="em">${p.emoji}</span><span class="t"><b>${p.nombre}</b><small>${p.desc}</small></span><span class="p">${peso(p.precio)}</span></div>`);
    }
    const b = document.createElement('button'); b.className = 'btn primario'; b.style.marginTop = '16px';
    b.textContent = 'Elegir en el muro 🧱'; b.onclick = () => irA('muro'); cuerpo.append(b);
  } else {
    $('panelTitulo').textContent = 'Cartelera';
    for (const s of CARTELERA) cuerpo.insertAdjacentHTML('beforeend',
      `<div class="fila"><span class="em">🎸</span><span class="t"><b>${s.banda}</b><small>${s.dia} · ${s.hora} — ${s.detalle}</small></span></div>`);
  }
  $('panel').classList.add('abierto'); $('panel').setAttribute('aria-hidden', 'false');
}
function cerrarPanel() { $('panel').classList.remove('abierto'); $('panel').setAttribute('aria-hidden', 'true'); }
$('cerrarPanel').onclick = cerrarPanel;

// ---------------- Modo editar (?editar) ----------------
function editorClick(viewer, data) {
  if (!EDITAR) return;
  const enVideo = viewer === visorVideo;
  let txt = `yaw: ${grados(data.yaw)}  pitch: ${grados(data.pitch)}`;
  if (enVideo) txt = `time: ${video.getTime().toFixed(1)} s\n` + txt;
  else txt += `\npíxel foto: [${Math.round(data.textureX)}, ${Math.round(data.textureY)}]`;
  $('editor').textContent = txt + '\n(toca otro punto)';
  console.log(txt);
}
if (EDITAR) {
  $('editor').hidden = false; $('editor').textContent = 'Modo editar: toca la imagen';
  visorVideo.addEventListener('click', ({ data }) => editorClick(visorVideo, data));
}

marcarPestana('recorrido');
const inicial = location.hash.slice(1);
if (PESTANAS.some((p) => p.id === inicial)) {
  // esperar a que el video esté listo antes de saltar (si no, vuelve al segundo 0)
  visorVideo.addEventListener('ready', () => setTimeout(() => irA(inicial), 800), { once: true });
}
window.bar = { visorVideo, video, irA, get visorFoto() { return visorFoto; }, get marcasFoto() { return marcasFoto; } };
</script>
</body>
